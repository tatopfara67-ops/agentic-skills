<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mythos Arsenal logo</title>
  <desc id="desc">Mythos Arsenal brand banner with a calculator-inspired icon and the words MYTHOS ARSENAL and AGENTIC SECURITY SKILLS.</desc>
  <rect width="1600" height="500" fill="#F2EFE9"/>

  <g transform="translate(80,82)">
    <rect x="0" y="0" width="330" height="330" rx="62" fill="#1E2D3D"/>

    <g fill="#F3F0EA">
      <rect x="46" y="54" width="90" height="55" rx="12"/>
      <rect x="150" y="54" width="90" height="55" rx="12"/>
      <rect x="46" y="125" width="90" height="55" rx="12"/>
      <rect x="150" y="125" width="90" height="55" rx="12"/>
      <rect x="46" y="196" width="90" height="55" rx="12"/>
      <rect x="150" y="196" width="90" height="55" rx="12"/>
    </g>

    <rect x="258" y="198" width="56" height="56" rx="10" fill="#D6702B"/>
    <rect x="258" y="147" width="56" height="56" rx="10" fill="#D6702B"/>
  </g>

  <g transform="translate(500,120)">
    <text x="0" y="130" font-size="146" font-weight="700" letter-spacing="0" fill="#1E2D3D" font-family="Segoe UI, Arial, sans-serif">MYTHOS</text>
    <text x="0" y="270" font-size="146" font-weight="700" fill="#1E2D3D" font-family="Segoe UI, Arial, sans-serif">ARSENAL</text>
    <text x="10" y="360" font-size="54" letter-spacing="12" fill="#1E2D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="300">AGENTIC SECURITY SKILLS</text>
  </g>
</svg>
